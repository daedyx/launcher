# Release des Daedyx Launchers: testen, Setup bauen, in das öffentliche Repository daedyx/releases veröffentlichen.
# Starten: Actions -> Release -> "Run workflow" (Version und Änderungsnotiz eintragen) oder einen Tag v<x.y.z> pushen.
# Geheimnisse (Repository-Secrets, trägt Björn selbst ein, Anleitung: docs/RELEASE-CI.md):
#   DAEDYX_CATALOG_KEY, DAEDYX_KEY_PASSWORD   Katalog-Schlüssel (Inhalt der Datei) und Passwort
#   RELEASES_TOKEN                            Zugriffstoken mit Schreibrecht nur auf daedyx/releases
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 0.2.0 (muss höher sein als die letzte veröffentlichte)"
        required: true
        type: string
      notes:
        description: "Änderungsnotiz: was ist neu?"
        required: true
        type: string
      skip_tests:
        description: "Tests überspringen (nur im Notfall)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Das Token des Workflows darf nur den Quellcode-Stand zurückschreiben (Cargo.toml, Cargo.lock); veröffentlicht wird mit RELEASES_TOKEN.
permissions:
  contents: write

# Nie zwei Veröffentlichungen gleichzeitig: beide würden denselben Katalog ändern.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: daedyx/releases

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Eingaben prüfen
        id: input
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          # Eingaben nur über Umgebungsvariablen lesen (nie in den Skripttext einsetzen)
          if ($env:EVENT -eq 'push') {
            $version = $env:REF_NAME.TrimStart('v')
            $notes = "Daedyx Launcher $version"
          } else {
            $version = $env:INPUT_VERSION.Trim()
            $notes = $env:INPUT_NOTES.Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungültige Version: '$version' (erwartet x.y.z)" }
          if (-not $notes) { throw "Die Änderungsnotiz fehlt." }
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          [System.IO.File]::WriteAllText($file, $notes, (New-Object System.Text.UTF8Encoding $false))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_file=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skip_tests=$($env:INPUT_SKIP_TESTS -eq 'true')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Secrets prüfen
        env:
          S1: ${{ secrets.DAEDYX_CATALOG_KEY }}
          S2: ${{ secrets.DAEDYX_KEY_PASSWORD }}
          S3: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:S1) { $missing += 'DAEDYX_CATALOG_KEY' }
          if (-not $env:S2) { $missing += 'DAEDYX_KEY_PASSWORD' }
          if (-not $env:S3) { $missing += 'RELEASES_TOKEN' }
          if ($missing) { throw "Diese Secrets fehlen im Repository: $($missing -join ', ') (Anleitung: docs/RELEASE-CI.md)" }

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Zwischenspeicher
        uses: Swatinem/rust-cache@v2

      - name: Version in Cargo.toml eintragen
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: ./scripts/ci/set-version.ps1 -Version $env:VERSION

      - name: Prüfen (Tests und Clippy)
        if: steps.input.outputs.skip_tests != 'True' && steps.input.outputs.skip_tests != 'true'
        run: |
          # Warnungen einer neueren Rust-Version sollen kein Release verhindern; nur echte Fehler brechen ab.
          cargo clippy --workspace --all-targets --features launcher-cli/test-helpers
          if ($LASTEXITCODE -ne 0) { throw "Clippy meldet Fehler." }
          # Einige Tests hängen an der Uhr oder an Prozessen: ein zweiter Versuch fängt Ausreißer ab, ein echter Fehler fällt wieder durch.
          cargo test --workspace --features launcher-cli/test-helpers
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Tests fehlgeschlagen, zweiter Versuch."
            cargo test --workspace --features launcher-cli/test-helpers
            if ($LASTEXITCODE -ne 0) { throw "Die Tests sind fehlgeschlagen." }
          }

      - name: NSIS bereitstellen
        run: |
          $found = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ }
          if (-not $found -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS konnte nicht installiert werden." }
          }

      - name: Katalog-Werkzeug laden
        run: scripts/ci/fetch-catalog-tool.ps1 -Destination "$env:RUNNER_TEMP/daedyx-catalog.exe"

      - name: Setup bauen
        env:
          VERSION: ${{ steps.input.outputs.version }}
          NOTES_FILE: ${{ steps.input.outputs.notes_file }}
        run: |
          $notes = Get-Content $env:NOTES_FILE -Raw
          $base = "https://github.com/$env:RELEASES_REPO/releases/download/launcher-v$env:VERSION/"
          # -RequireRealKey: bricht ab, solange in assets/catalog.pub ein Platzhalter steht
          ./scripts/build-setup.ps1 -Version $env:VERSION -Notes $notes -BaseUrl $base -RequireRealKey

      - name: In daedyx/releases veröffentlichen
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DAEDYX_CATALOG_KEY: ${{ secrets.DAEDYX_CATALOG_KEY }}
          DAEDYX_KEY_PASSWORD: ${{ secrets.DAEDYX_KEY_PASSWORD }}
          VERSION: ${{ steps.input.outputs.version }}
          NOTES_FILE: ${{ steps.input.outputs.notes_file }}
        run: |
          ./scripts/ci/publish.ps1 -Version $env:VERSION `
            -OutDir (Join-Path $PWD "dist/$env:VERSION") `
            -NotesFile $env:NOTES_FILE `
            -PublicKey crates/launcher-core/assets/catalog.pub `
            -CatalogTool (Join-Path $env:RUNNER_TEMP 'daedyx-catalog.exe') `
            -ReleasesRepo $env:RELEASES_REPO

      - name: Versionsdateien zurück in den Quellcode schreiben
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          git config user.name "daedyx release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: Version $env:VERSION"
            git push origin HEAD
          }
