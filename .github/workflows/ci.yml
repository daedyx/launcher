# Prüfung bei jedem Push und Pull Request (docs/SICHERHEIT.md 6.2, T1).
# Keine Secrets, nur Lesen, Actions per voller Commit-ID, kein pull_request_target.
name: ci

on:
  push:
  pull_request:

permissions: {}

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  # Zuerst und allein: Scan und Ausnahmenzähler auf einem frischen Checkout, bevor irgendein Code aus dem Repo läuft
  # (Tests, Build-Skripte, Proc-Makros). Sie lesen den Commit (`--head`), nicht den Arbeitsordner
  # (Review Prüflücken H-2). Alle anderen Jobs warten darauf (`needs`).
  vorpruefung:
    name: scan, exceptions (vor jedem Build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ohne Cargo: Eine Cargo-Konfiguration mit `runner`, `rustc-wrapper` u. a. könnte sonst Tests und
      # Prüfprogramme abschalten (Review Prüflücken H-1). Erlaubt ist nur der xtask-Alias. Das Prüfprogramm selbst
      # darf beim Bauen keinen fremden Code ausführen: kein Build-Skript, keine Abhängigkeiten.
      - name: Cargo-Konfiguration und Prüfprogramm prüfen (ohne Cargo)
        shell: pwsh
        run: |
          $muster = '(^|/)(\.cargo/config(\.toml)?|rust-toolchain(\.toml)?)$'
          $dateien = @(git ls-files | Where-Object { $_ -match $muster })
          if ($dateien.Count -ne 1 -or $dateien[0] -ne '.cargo/config.toml') { throw "Nur .cargo/config.toml ist erlaubt, gefunden: $dateien" }
          $erlaubt = @('[alias]', 'xtask = "run --quiet --package xtask --"')
          $zeilen = @(Get-Content .cargo/config.toml | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if (($zeilen -join "`n") -ne ($erlaubt -join "`n")) { throw ".cargo/config.toml enthält mehr als den xtask-Alias" }
          if (git ls-files 'xtask/build.rs') { throw "xtask/build.rs ist nicht erlaubt" }
          $xtask = @(Get-Content xtask/Cargo.toml | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($xtask | Where-Object { $_ -match '^\[.*dependencies' -or $_ -match '^build\s*=' -or $_ -match 'proc-macro' }) { throw "xtask/Cargo.toml darf keine Abhängigkeiten und kein Build-Skript haben" }
      - name: Keine Secrets in Workflows (release.yml ohne jedes Secret)
        shell: pwsh
        run: |
          # Wie Tasks (Review T6 H6-2, Review T7v M-T7v-1): Zugriff mit Punkt, eckigen Klammern oder toJSON zählt. Groß/klein
          # beachten: das Wort Secrets in Kommentaren ist kein Zugriff.
          $treffer = Select-String -Path .github/workflows/*.yml -CaseSensitive -Pattern 'secrets\.(?!GITHUB_TOKEN\b)', 'secrets\[', 'toJSON\(\s*secrets'
          if ($treffer) { $treffer; throw "Unerwartetes Secret in einem Workflow" }
          # Der Release-Weg kommt ganz ohne Secret aus (plan-ohne-secrets). Die Zeile mit den Mustern steht wörtlich so im
          # Test release_tests.rs (launcher-core), der sie gegen Beispiele prüft.
          $releaseMuster = 'secrets\s*[.\[:)]', '\(\s*secrets'
          if (Select-String -Path .github/workflows/release.yml -CaseSensitive -Pattern $releaseMuster) { throw "release.yml darf kein Secret lesen" }
      - name: Rust festnageln
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION
      # Nur das xtask-Crate bauen (nur Standardbibliothek) und direkt starten, nicht über `cargo run`.
      - run: cargo build --locked --package xtask
      - run: .\target\debug\xtask.exe scan --head
      - run: .\target\debug\xtask.exe exceptions --head

  pruefen:
    name: fmt, clippy, test, Testzahl
    needs: vorpruefung
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust festnageln
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION
      - run: cargo fetch --locked
      # Das Prüfprogramm vor jedem anderen Code bauen und beiseitelegen.
      - name: xtask bauen
        shell: pwsh
        run: |
          cargo build --locked --offline --package xtask
          Copy-Item .\target\debug\xtask.exe "$env:RUNNER_TEMP\xtask.exe"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      # bash läuft bei GitHub mit `-eo pipefail`: ein Fehler in `cargo test` bleibt trotz `tee` rot.
      - name: Tests mit Protokoll
        shell: bash
        run: cargo test --workspace --all-features --locked --offline 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Keine Testgruppe darf still wegfallen: Mindestzahl je Testprogramm aus dem Commit (xtask/testzahlen.txt).
      - name: Testzahl
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\xtask.exe" testzahl "$env:RUNNER_TEMP\test.log" --head'
      # Tests dürfen keine versionierten Dateien ändern.
      - name: Arbeitsordner unverändert
        shell: pwsh
        run: |
          $aenderungen = git status --porcelain --untracked-files=no
          if ($aenderungen) { throw "Tests haben versionierte Dateien geändert: $aenderungen" }

  lieferkette:
    name: cargo deny, cargo audit
    needs: vorpruefung
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust festnageln
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Werkzeuge in fester Version (Quelle crates.io, Prüfsummen über Cargo.lock der Werkzeuge)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny --locked check advisories bans licenses sources
      - run: cargo audit --deny warnings
