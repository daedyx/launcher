# Prüfung bei jedem Push und Pull Request (docs/SICHERHEIT.md 6.2, T1).
# Keine Secrets, nur Lesen, Actions per voller Commit-ID, kein pull_request_target.
name: ci

on:
  push:
  pull_request:

permissions: {}

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  pruefen:
    name: fmt, clippy, test, scan
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vor dem ersten Cargo-Aufruf und ohne Cargo: Eine Cargo-Konfiguration mit `runner`, `rustc-wrapper` u. a.
      # könnte sonst Tests und Prüfprogramme abschalten (Review Prüflücken H-1). Erlaubt ist nur der xtask-Alias.
      - name: Cargo-Konfiguration prüfen (ohne Cargo)
        shell: pwsh
        run: |
          $muster = '(^|/)(\.cargo/config(\.toml)?|rust-toolchain(\.toml)?)$'
          $dateien = @(git ls-files | Where-Object { $_ -match $muster })
          if ($dateien.Count -ne 1 -or $dateien[0] -ne '.cargo/config.toml') { throw "Nur .cargo/config.toml ist erlaubt, gefunden: $dateien" }
          $erlaubt = @('[alias]', 'xtask = "run --quiet --package xtask --"')
          $zeilen = @(Get-Content .cargo/config.toml | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if (($zeilen -join "`n") -ne ($erlaubt -join "`n")) { throw ".cargo/config.toml enthält mehr als den xtask-Alias" }
      - name: Rust festnageln
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - run: cargo test --workspace --all-features --locked --offline
      # Die Prüfprogramme direkt starten, nicht über `cargo run` (so kommt kein Runner dazwischen).
      - run: cargo build --locked --offline --package xtask
      - run: .\target\debug\xtask.exe scan
      - run: .\target\debug\xtask.exe exceptions

  lieferkette:
    name: cargo deny, cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust festnageln
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Werkzeuge in fester Version (Quelle crates.io, Prüfsummen über Cargo.lock der Werkzeuge)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny --locked check advisories bans licenses sources
      - run: cargo audit --deny warnings
