[workspace]
resolver = "2"
members = [
    "crates/daedyx-update",
    "crates/launcher-core",
    "crates/launcher-cli",
    "crates/launcher-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.11.1"
hex = "0.4.3"
minisign-verify = "0.3.0"
thiserror = "2.0.21"
ureq = "3.5.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
tempfile = "3.27.0"
minisign = "0.10.0"
eframe = "0.37.0"
egui_kittest = "0.37.0"
sys-locale = "0.3.2"
winreg = "0.56.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
rpassword = "7.5.5"
