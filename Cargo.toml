[workspace]
resolver = "2"
members = [
    "crates/launcher-core",
    "crates/launcher-cli",
    "crates/launcher-ui",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Gemeinsame Update-Bibliothek (Kern daedyx/core, U1) per Tag, mit dem Merkmal `net` (U3 F-U3-1): Eintrag,
# GitHub-Nachweis, Version, Download, Sperre, Zustand, Netz.
daedyx-update = { git = "https://github.com/daedyx/core", tag = "daedyx-update-v0.2.0", features = ["net"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
tempfile = "3.27.0"
eframe = "0.37.0"
egui_kittest = "0.37.0"
sys-locale = "0.3.2"
winreg = "0.56.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

# Sicherheitsrahmen (docs/SICHERHEIT.md, Abschnitt 2 und Anhang A).
# Ausnahmen nur mit Eintrag in docs/SICHERHEIT-AUSNAHMEN.md.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Absturzfreiheit (2.2)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
# Keine Ausgaben/Protokolle (2.11)
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# unsafe nur dokumentiert
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Rechnen und Umwandeln
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
mem_forget = "deny"
exit = "deny"
